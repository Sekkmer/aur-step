[package]
name = "aur-step"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Root-supervised, user-built AUR orchestration primitive"

[dependencies]
anyhow = "1.0.104"
camino = { version = "1", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
nix = { version = "0.31", features = ["process", "user"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "1.1"
